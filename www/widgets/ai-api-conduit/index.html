<div class="ai-api-conduit__main">
  <div>
    netnet <span class="link" onclick="WIDGETS['ai-api-conduit'].convo('integration', true)">integration</span>:&nbsp;&nbsp;
    <select class="pill-btn pill-btn--secondary" name="integration">
      <option value="widget">output widget</option>
      <option value="possessed">possessed convo</option>
    </select>
  </div>
  <div class="ai-api-conduit__flex">
    <p>
      Choose an <span class="link" onclick="WIDGETS['ai-api-conduit'].convo('choose-provider2', true)">LLM provider</span>:&nbsp;&nbsp;
      <select class="pill-btn pill-btn--secondary" name="provider">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="ollama">Local (Ollama)</option>
        <option value="disabled">Disabled</option>
      </select>
    </p>
    <button class="pill-btn pill-btn--secondary" name="help-btn">?</button>
  </div>
  <div name="api-key-section" style="margin-bottom: 17px;">
    <p>
      Your API Key: <input type="password" name="api-key" placeholder="sent in request header" style="width: 340px; padding: 0 5px;">
    </p>
  </div>

  <div class="ai-api-conduit__tabs">
    <div class="ai-api-conduit__tab-labels">
      <span class="ai-api-conduit__tab-label active" data-tab="request">API Request</span>
      <span class="ai-api-conduit__tab-label" data-tab="system">System Prompt</span>
      <span class="ai-api-conduit__tab-label" data-tab="attach">Attach Files</span>
      <span class="ai-api-conduit__tab-label" data-tab="test">Test</span>
    </div>

    <div class="ai-api-conduit__tab" data-tab="request">
      <div class="ai-api-conduit__options">
        <div>
          structure code for
          <label><input type="radio" name="mode" value="library"> <code>nn.prompt()</code> library</label>, or plain
          <label><input type="radio" name="mode" value="vanilla"> <i>vanilla</i> JS</label>
        </div>
        <div name="extended-option">
          <label><input type="checkbox" name="extended"> show extended options</label>
        </div>
        <div>
          <label><input type="checkbox" name="attach-files"> attach files from my sketch or project</label>
        </div>
      </div>
      <pre name="request-body"></pre>
    </div>

    <div class="ai-api-conduit__tab" data-tab="system" style="display:none;">
      <div class="ai-api-conduit__options ai-api-conduit__system-status">
        <span>using <span name="system-prompt-status"></span></span>
        <button class="pill-btn pill-btn--secondary" name="system-prompt-reset">reset to default</button>
      </div>
      <textarea name="system-prompt" spellcheck="false"></textarea>
    </div>

    <div class="ai-api-conduit__tab" data-tab="attach" style="display:none;">
      <div name="attach-content"></div>
    </div>

    <div class="ai-api-conduit__tab" data-tab="test" style="display:none;">
      <textarea name="user-input" placeholder="type your question or prompt for the LLM here..." spellcheck="false"></textarea>
      <div class="ai-api-conduit__test-actions">
        <button class="pill-btn" name="send-btn">send request</button>
      </div>
      <pre name="response-display"></pre>
    </div>
  </div>
</div>
